plugins {
id 'groovy'
}
repositories {
    mavenCentral()
}
ext {
    groovyVersion = '4.0.24'
    gebVersion = '7.0'
    seleniumVersion = '4.27.0'
    cucumberVersion = '7.20.1'
    junitPlatformSuite = '1.11.3'
    restAssuredVersion = '5.5.0'
}
dependencies {
    testImplementation "org.apache.groovy:groovy:$groovyVersion"
    testImplementation "org.apache.groovy:groovy-json:$groovyVersion"
    testImplementation "org.gebish:geb-core:$gebVersion"
    testImplementation "org.seleniumhq.selenium:selenium-chrome-driver:$seleniumVersion"
    testImplementation "org.seleniumhq.selenium:selenium-support:$seleniumVersion"
    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
    testImplementation "io.cucumber:cucumber-java:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:$cucumberVersion"
    testImplementation "org.junit.platform:junit-platform-suite:$junitPlatformSuite"
}
compileTestGroovy {
    options.encoding = 'UTF-8'
    groovyOptions.encoding = 'UTF-8'
}
test {
    useJUnitPlatform()
    systemProperty 'geb.env', project.findProperty('headless') == 'false' ? 'chrome' :
            'chromeHeadless'
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat 'full'
    }
}
